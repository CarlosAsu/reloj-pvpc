name: Actualizar precios PVPC

on:
  schedule:
    - cron: '7 * * * *'   # cada hora, en el minuto 7
  workflow_dispatch:       # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency: pvpc

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar precios de Red Eléctrica
        run: |
          mkdir -p datos
          hoy=$(TZ=Europe/Madrid date +%F)
          manana=$(TZ=Europe/Madrid date -d tomorrow +%F)
          for dia in "$hoy" "$manana"; do
            url="https://apidatos.ree.es/es/datos/mercados/precios-mercados-tiempo-real?start_date=${dia}T00:00&end_date=${dia}T23:59&time_trunc=hour"
            if curl -sS --max-time 30 --retry 2 "$url" -o tmp.json; then
              horas=$(jq '[.included[]? | select(.id=="1001") | .attributes.values[]] | length' tmp.json 2>/dev/null || echo 0)
              if [ "${horas:-0}" -ge 20 ]; then
                jq -c '{included: [.included[] | select(.id=="1001")]}' tmp.json > "datos/${dia}.json"
                echo "OK ${dia}: ${horas} valores"
              else
                echo "Sin precios publicados para ${dia}"
              fi
            else
              echo "No se pudo conectar con REE para ${dia}"
            fi
          done
          rm -f tmp.json
          # borrar archivos de hace más de 7 días
          limite=$(TZ=Europe/Madrid date -d '7 days ago' +%F)
          for f in datos/*.json; do
            if [ -f "$f" ] && [[ "$(basename "$f" .json)" < "$limite" ]]; then rm -f "$f"; fi
          done

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A datos
          if ! git diff --cached --quiet; then
            git commit -m "Precios PVPC actualizados"
            git push
          fi

      - name: Comprobar que hay precios de hoy
        run: |
          hoy=$(TZ=Europe/Madrid date +%F)
          if [ ! -f "datos/${hoy}.json" ]; then
            echo "::error::No hay precios de hoy (${hoy}). Revisa el paso de descarga."
            exit 1
          fi
